name = "repo-watcher"
main = "src/index.js"
compatibility_date = "2026-03-01"
keep_vars = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.svg"]
fallthrough = true

[[kv_namespaces]]
binding = "KV_DEFAULT"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
